name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # This step is crucial for Selenium tests
    # Installs Google Chrome and a compatible ChromeDriver
    - name: Install Google Chrome and ChromeDriver
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        
        # Install jq for reliable JSON parsing
        sudo apt-get install -y jq
        
        # New, reliable way to find and install the correct ChromeDriver version
        # It fetches the URL for the latest stable version
        CHROME_DRIVER_URL=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json" | \
          jq -r '.channels.Stable.downloads.chromedriver[] | select(.platform == "linux64") | .url')

        echo "CHROMEDRIVER_URL: $CHROME_DRIVER_URL"

        # The rest of the download and setup logic remains the same
        wget -O chromedriver.zip $CHROME_DRIVER_URL
        unzip chromedriver.zip
        
        # The unzip command extracts to a new directory, so we need to move it
        mv chromedriver-linux64/chromedriver chromedriver
        chmod +x chromedriver
        
        # Move ChromeDriver to a path that is in the PATH environment variable
        sudo mv -f chromedriver /usr/local/share/chromedriver
        sudo ln -s /usr/local/share/chromedriver /usr/local/bin/chromedriver

    # This step runs your tests
    - name: Run tests with Maven
      run: mvn test -Pdemowebtest
